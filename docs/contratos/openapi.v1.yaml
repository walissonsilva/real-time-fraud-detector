openapi: 3.1.0
info:
  title: Motor de Detecção de Transações Suspeitas — API HTTP operacional v1
  version: 1.0.0
  description: |
    Contrato HTTP **implementado** pelo serviço: apenas os endpoints operacionais (`src/health/`).

    A ingestão de transações e a entrega de alertas não passam por HTTP: o serviço consome a fila SQS `transactions` e publica no SNS FIFO `alerts.fifo` (ADR-01), conforme os schemas JSON desta pasta. As regras são gerenciadas no AWS AppConfig (ADR-03), não por API.

    Uma API de administração (regras, canais, consulta de alertas) e a ingestão HTTP chegaram a ser desenhadas e foram **retiradas deste contrato** por não estarem implementadas; ver "Limitações conhecidas" no README do repositório.

    Os endpoints não exigem autenticação: ficam atrás da rede privada da VPC e não expõem PII (`/metrics` tem apenas contadores e gauges).
servers:
  - url: http://localhost:3000
    description: Local / tarefa ECS (porta 3000, sem exposição pública)
tags:
  - name: Operação

paths:
  /health/live:
    get:
      tags: [Operação]
      operationId: healthLive
      summary: Liveness — o processo está de pé
      description: Não toca dependências. É o healthcheck do contêiner no ECS.
      responses:
        '200':
          description: Vivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Live' }
  /health/ready:
    get:
      tags: [Operação]
      operationId: healthReady
      summary: Readiness — falha se o Postgres estiver fora
      description: |
        Dependência crítica = Postgres (gravação de alertas). O Redis aparece em `checks`, mas **não** derruba o readiness (nenhuma regra o utiliza; ver ADR-02). Falha do AppConfig, de canais e de provedores também não afeta o readiness (degradação, ADR-05).
      responses:
        '200':
          description: Pronto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }
        '503':
          description: Não pronto (Postgres indisponível).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotReady' }
  /metrics:
    get:
      tags: [Operação]
      operationId: metrics
      summary: Métricas em texto (formato Prometheus)
      description: |
        Contadores, gauges e histogramas do processo, sem PII. `outbox_pending` e `outbox_oldest_pending_age_ms` são lidos do banco a cada consulta; com o banco fora, os demais são devolvidos sem esses dois gauges.
      responses:
        '200':
          description: Métricas.
          content:
            text/plain:
              schema: { type: string }

components:
  schemas:
    Checks:
      type: object
      description: Estado de cada dependência verificada.
      required: [postgres, redis]
      properties:
        postgres: { enum: [up, down] }
        redis: { enum: [up, down] }
    Live:
      type: object
      required: [status]
      properties:
        status: { const: ok }
    Ready:
      type: object
      required: [status, checks]
      properties:
        status: { const: ok }
        checks: { $ref: '#/components/schemas/Checks' }
    NotReady:
      type: object
      required: [status, checks]
      properties:
        status: { const: unavailable }
        checks: { $ref: '#/components/schemas/Checks' }
