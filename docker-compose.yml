services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns
      DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    profiles: ["app"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://fraud:fraud@postgres:5432/fraud
      REDIS_URL: redis://redis:6379
      AWS_ENDPOINT_URL: http://localstack:4566
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }

volumes:
  pgdata:
